services:
  postgres:
    image: postgres:16
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./mnt/n8n/postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6868:5432"
    networks:
      - n8n-network

  n8n:
    build:
      context: .
      dockerfile: ./docker/n8n/Dockerfile
    container_name: n8n
    restart: unless-stopped
    ports:
      - "6789:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - NODES_EXCLUDE=[]
      - NODE_FUNCTION_ALLOW_EXTERNAL=cheerio
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    volumes:
      - ./mnt/n8n/n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      chromium:
        condition: service_healthy
    networks:
      - n8n-network

  n8n-runner:
    image: n8nio/runners:2.12.2
    container_name: n8n-runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    depends_on:
      - n8n
    networks:
      - n8n-network

  vllm:
    image: vllm/vllm-openai:gptoss
    container_name: vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ipc: host
    command: ["--model", "openai/gpt-oss-20b", "--host", "0.0.0.0", "--port", "8000", "--served-model-name", "gpt-oss-20b"]
    volumes:
      - ./mnt/vllm/cache:/root/.cache/huggingface
    ports:
      - "6969:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - n8n-network

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.4.5
    container_name: n8n-openclaw-gateway
    restart: unless-stopped
    init: true
    command: ["node", "openclaw.mjs", "gateway", "run", "--allow-unconfigured", "--bind", "lan"]
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=Asia/Ho_Chi_Minh
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - VLLM_API_KEY=vllm-local
      - VLLM_BASE_URL=http://vllm:8000/v1
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    volumes:
      - ./mnt/openclaw/config:/home/node/.openclaw
      - ./mnt/openclaw/workspace:/home/node/.openclaw/workspace
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18789/healthz 2>/dev/null | grep -q ok || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - n8n-network

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:2026.4.5
    container_name: n8n-openclaw-cli
    restart: "no"
    network_mode: "service:openclaw-gateway"
    stdin_open: true
    tty: true
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - TZ=Asia/Ho_Chi_Minh
      - BROWSER=echo
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      - OPENCLAW_GATEWAY_URI=ws://localhost:18789
    volumes:
      - ./mnt/openclaw/config:/home/node/.openclaw
      - ./mnt/openclaw/workspace:/home/node/.openclaw/workspace
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    depends_on:
      - openclaw-gateway

  chromium:
    image: ghcr.io/browserless/chromium:latest
    container_name: n8n-chromium
    restart: unless-stopped
    environment:
      - MAX_CONCURRENT_SESSIONS=5
      - CONNECTION_TIMEOUT=60000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/json/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge
